<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="asset/css/styleLog.css">
</head>
<body>
  
    <!--panel principal-->
   
    <div class="card">

        <!-- panel de imagen izquierdo-->
        <div class="panel-imagen">
            <div class="panel-texto">
                <p class="lema">"Cada sorbo cuenta una historia cálida"</p>
                <div class="linea-decorativa"></div>
                <span class="nombre-marca">Dulce Aroma a Café</span>
            </div>
        </div>

        <!-- panel derecho formulario -->
        <div class="panel-form">
            <!--logo-->
            <div class="logo">
                   <img src="asset/img/logo-simple.png" alt="" width="110" height="100">
                <div class="logo-texto">
                    <span class="logo-linea1">Dulce Aroma</span>
                    <span class="logo-linea2">a Café</span>
                </div>
            </div>

            <!-- titulo de form -->
            <h1 class="titulo">Bienvenido de vuelta,<br><strong>inicia sesión</strong></h1>

            <!--formulario de inicio-->
            <form action="">

                <div class="campo">
                    <label for="">Nombre</label>
                    <input type="text" id="nombre" placeholder="Tu nombre de usuario">
                </div>

                <div class="campo">
                    <label for="">Contraseña</label>
                    <input type="password" id="password" placeholder="Contraseña">
                </div>

                <button type="button" id="btnEnviar">enviar</button>

            </form>

            <!-- Separador visual -->
            <div class="separador">
                <span></span> o <span></span>
            </div>


            <a href="#" class="btn-registro">Crear una cuenta</a>

        </div>
    </div>


    <script src="asset/js/main.js"></script>
</body>
</html>
